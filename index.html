<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#151219" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="App del Mago">
  <meta name="description" content="App del Mago — el estudio del mago: tu biblioteca de trucos, rutinas y bolos.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="App del Mago">
  <meta property="og:title" content="App del Mago">
  <meta property="og:description" content="El estudio del mago: tu biblioteca de trucos, rutinas y bolos.">
  <meta property="og:url" content="https://appdelmago.com">
  <meta property="og:image" content="https://appdelmago.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="App del Mago">
  <meta name="twitter:description" content="El estudio del mago: tu biblioteca de trucos, rutinas y bolos.">
  <meta name="twitter:image" content="https://appdelmago.com/og-image.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <script>
    /* Aplica el tema guardado antes de pintar (evita parpadeo) */
    (function () {
      try {
        var m = localStorage.getItem("magic_theme");
        if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <title>App del Mago</title>
</head>
<body>
  <div class="app">
    <div id="view"></div>
  </div>
  <script src="supabase.js"></script>
  <script src="tus.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
