<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#0b0b0d">
<title>Preparando…</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; }
  body {
    color: #cfcfd6; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 32px;
    padding-top: calc(32px + env(safe-area-inset-top)); padding-bottom: calc(32px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .d { width: 12px; height: 12px; border-radius: 50%; background: #cfcfd6; opacity: .5; animation: p 1.6s ease-in-out infinite; }
  .m { font-size: 15px; opacity: .82; max-width: 20em; line-height: 1.5; letter-spacing: .01em; }
  @keyframes p { 0%, 100% { opacity: .22; transform: scale(.8); } 50% { opacity: .7; transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { .d { animation: none; } }
</style>
</head>
<body>
  <div class="d" id="d" aria-hidden="true"></div>
  <div class="m" id="m">Preparando…</div>
  <script>
  /* Página temporal del espectador. Deliberadamente aislada de la app:
     - sin app.js/styles.css, sin service worker, sin marca ni menú
     - sin localStorage/cookies: solo peticiones fetch a las RPC anónimas
     - la URL de redirección la decide el servidor; aquí solo se ejecuta */
  (function () {
    "use strict";
    var SB = "https://dculvupbfsjqunilkjyp.supabase.co";
    var KEY = "sb_publishable_qHuttKEqb16rFw8m9cW3_w_j_GutgZ_";
    var msg = document.getElementById("m");
    function neutral(t) { msg.textContent = t; }
    function gone() { stop(); neutral("Este enlace ya no está disponible."); }
    function param(k) { try { var m = location.search.match(new RegExp("[?&]" + k + "=([^&]+)")); return m ? decodeURIComponent(m[1]) : ""; } catch (e) { return ""; } }
    // Enlace permanente por mago: appdelmago.com/r#<código>. También acepta
    // /r/<código>, ?c=<código> y el antiguo ?t=<token>.
    // Enlace por carpeta: appdelmago.com/m/<código>. También /r/<código>, ?c= y #.
    var code = "";
    try { if (location.hash && location.hash.length > 1) code = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (!code) { try { var pm = location.pathname.match(/\/(?:m|r)\/([^/?#]+)/); if (pm) code = decodeURIComponent(pm[1]); } catch (e) {} }
    if (!code) code = param("c");
    code = (code || "").replace(/[^A-Za-z0-9]/g, "");   // el código es base36; descarta cualquier otra cosa
    var tok = param("t");
    if (!code) { neutral("Este enlace ya no está disponible."); return; }
    function rpc(fn, body, keepalive) {
      return fetch(SB + "/rest/v1/rpc/" + fn, {
        method: "POST",
        headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
        body: JSON.stringify(body), cache: "no-store", credentials: "omit", keepalive: !!keepalive
      }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }
    var done = false, timer = null, tries = 0, baseline = 0;
    function stop() { if (timer) { clearInterval(timer); timer = null; } }

    /* --- Salida a YouTube (sin ningún toque) ---
       El móvil se usa BOCA ABAJO y con el volumen físico al mínimo. Al llegar la
       señal, la página sale a YouTube con una navegación normal a m.youtube.com
       (location.replace, sin rastro en el historial). En Android ese enlace es un
       App Link verificado de YouTube: el sistema abre la APP de YouTube directa,
       SIN NINGÚN TOQUE. (Nota: los esquemas propios de app y el intent de Android
       SÍ exigen un gesto en Chrome y por eso no sirven aquí; el App Link https no.)
       YouTube arranca la canción con sonido; como el volumen físico está al
       mínimo, no se oye… hasta que el espectador sube el botón físico de volumen
       (ese es el efecto). Al coger el móvil ya está en YouTube de verdad. */
    function ytUrl(id, t) { return "https://m.youtube.com/watch?v=" + id + "&t=" + (t || 0) + "s"; }
    function go(reveal, rev) {
      if (done || !reveal || !reveal.video_id) return;
      done = true; stop();
      // Acuse de entrega (no bloquea). La sesión NO caduca ni se consume.
      rpc("mr_spec_ack", { p_code: code, p_rev: rev || 0 }, true);
      window.location.replace(ytUrl(reveal.video_id, reveal.start_seconds));
    }
    function poll() {
      rpc("mr_spec_poll", { p_code: code, p_since: baseline }).then(function (p) {
        if (!p) { tries++; if (tries > 40) gone(); return; } // fallo de red transitorio: reintenta
        tries = 0;
        if (p.ok && p.reveal && p.reveal.video_id) { go(p.reveal, p.rev); return; }
        // p.ok sin señal nueva → sigue esperando (siempre disponible).
        if (!p.ok && p.reason === "not_found") { gone(); return; }
      });
    }
    // Baseline: espera una señal MÁS NUEVA que la que hay al entrar.
    rpc("mr_spec_state", { p_code: code }).then(function (s) {
      if (!s || (s.ok === false && s.reason === "not_found")) { gone(); return; }
      baseline = (s && typeof s.rev === "number") ? s.rev : 0;
      poll();
      // Sondeo rápido (400 ms): entrega casi instantánea y, a la vez, sirve de
      // latido de presencia (cada sondeo marca spectator_seen_at en el servidor,
      // así el mago sabe que hay alguien mirando y puede enviar).
      timer = setInterval(poll, 400);
    });
    // Mantiene la pantalla del espectador encendida mientras espera (Wake Lock).
    // El SO lo suelta al ocultar/bloquear, así que se vuelve a pedir al regresar.
    var wl = null;
    function keepAwake() {
      try {
        if (navigator.wakeLock && navigator.wakeLock.request) {
          navigator.wakeLock.request("screen").then(function (w) { wl = w; }).catch(function () {});
        }
      } catch (e) {}
    }
    keepAwake();
    // Recupera sondeo y Wake Lock al volver a primer plano (bloqueo/desbloqueo, 2º plano)
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && !done) { poll(); keepAwake(); }
    });
  })();
  </script>
</body>
</html>
