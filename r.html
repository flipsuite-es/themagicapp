  <script>
  /* Página temporal del espectador. Deliberadamente aislada de la app:
     - sin app.js/styles.css, sin service worker, sin marca ni menú
     - sin localStorage/cookies: solo peticiones fetch a las RPC anónimas
     - la URL de redirección la decide el servidor; aquí solo se ejecuta */
  (function () {
    "use strict";
    var SB = "https://dculvupbfsjqunilkjyp.supabase.co";
    var KEY = "sb_publishable_qHuttKEqb16rFw8m9cW3_w_j_GutgZ_";
    var msg = document.getElementById("m");
    function neutral(t) { msg.textContent = t; }
    function gone() { stop(); neutral("Este enlace ya no está disponible."); }
    function param(k) { try { var m = location.search.match(new RegExp("[?&]" + k + "=([^&]+)")); return m ? decodeURIComponent(m[1]) : ""; } catch (e) { return ""; } }
    // Enlace permanente por mago: appdelmago.com/r#<código>. También acepta
    // /r/<código>, ?c=<código> y el antiguo ?t=<token>.
    // Enlace por carpeta: appdelmago.com/m/<código>. También /r/<código>, ?c= y #.
    var code = "";
    try { if (location.hash && location.hash.length > 1) code = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (!code) { try { var pm = location.pathname.match(/\/(?:m|r)\/([^/?#]+)/); if (pm) code = decodeURIComponent(pm[1]); } catch (e) {} }
    if (!code) code = param("c");
    code = (code || "").replace(/[^A-Za-z0-9]/g, "");   // el código es base36; descarta cualquier otra cosa
    var tok = param("t");
    if (!code) { neutral("Este enlace ya no está disponible."); return; }
    function rpc(fn, body, keepalive) {
      return fetch(SB + "/rest/v1/rpc/" + fn, {
        method: "POST",
        headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
        body: JSON.stringify(body), cache: "no-store", credentials: "omit", keepalive: !!keepalive
      }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }
    var done = false, timer = null, tries = 0, baseline = 0, wakeTimer = null;
    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      if (wakeTimer) { clearInterval(wakeTimer); wakeTimer = null; }
      // El vídeo anti-apagado NO se pausa aquí: tras la señal, la pantalla debe
      // seguir protegida durante la ventana de espera del toque (la navegación
      // que llega después lo termina todo de forma natural).
    }

    /* --- Salida a YouTube, sin ningún toque y SIN diálogos ---
       El móvil se usa BOCA ABAJO y con el volumen físico al mínimo. Entre dejarlo
       boca abajo y subir el volumen NO HAY NINGÚN TOQUE. Al llegar la señal:
       · Android: un intent con el PAQUETE explícito (com.google.android.youtube).
         Al nombrar el paquete, el sistema abre esa app DIRECTAMENTE, saltándose
         cualquier ajuste de "enlaces verificados" del teléfono, sin preguntar. Se
         lanza por un iframe oculto (no navega la página si la app no está) y
         también por navegación, para máxima fiabilidad. Si no hay app, la web.
       · iPhone: se navega al enlace normal de YouTube (m.youtube.com), sin ningún
         diálogo. NO se usan esquemas propios de app porque iOS SIEMPRE muestra un
         "¿Abrir en YouTube?" con ellos, y eso rompe el efecto. En iPhone, abrir
         la app sin diálogo exigiría un toque real sobre un enlace; sin toque y
         sin diálogo, la opción correcta es la web.
       La app/web arranca la canción con sonido; con el volumen al mínimo no se
       oye… hasta que el espectador lo sube (ese es el efecto). */
    function ytUrl(id, t) { return "https://m.youtube.com/watch?v=" + id + "&t=" + (t || 0) + "s"; }
    function ytAppAndroid(id, t) {
      return "intent://www.youtube.com/watch?v=" + id + "&t=" + t +
        "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" +
        encodeURIComponent(ytUrl(id, t)) + ";end";
    }
    function go(reveal, rev) {
      if (done || !reveal || !reveal.video_id) return;
      done = true; stop();
      // Acuse de entrega (no bloquea). La sesión NO caduca ni se consume.
      rpc("mr_spec_ack", { p_code: code, p_rev: rev || 0 }, true);
      var id = reveal.video_id, t = reveal.start_seconds || 0, ua = navigator.userAgent || "";
      var web = ytUrl(id, t);
      if (/Android/i.test(ua)) {
        // Intento por iframe oculto: dispara la app sin mover la página si falla.
        try {
          var ifr = document.createElement("iframe"); ifr.style.display = "none";
          ifr.setAttribute("src", "intent://www.youtube.com/watch?v=" + id + "&t=" + t +
            "#Intent;scheme=https;package=com.google.android.youtube;end");
          document.body.appendChild(ifr);
        } catch (e) {}
        // Intento por navegación con paquete explícito + respaldo web integrado.
        try { window.location.href = ytAppAndroid(id, t); } catch (e) { window.location.replace(web); }
        // Salvavidas: si nada navegó (app ausente), a la web real de YouTube.
        window.setTimeout(function () { if (!document.hidden) window.location.replace(web); }, 1200);
      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        // iOS: navega DIRECTO a la APP de YouTube por su esquema. En Chrome y en
        // la app de Google abre la app directamente; conviene abrir el enlace del
        // espectador en Google/Chrome (en Safari, iOS añade un diálogo de
        // confirmación por su propia política de esquemas). Respaldo a la web.
        try { window.location.href = "youtube://watch?v=" + id + "&t=" + t; } catch (e) {}
        window.setTimeout(function () { if (!document.hidden) window.location.replace(web); }, 700);
      } else {
        window.location.replace(web);
      }
    }
    function poll() {
      rpc("mr_spec_poll", { p_code: code, p_since: baseline, p_ka: kaState() }).then(function (p) {
        if (!p) { tries++; if (tries > 40) gone(); return; } // fallo de red transitorio: reintenta
        tries = 0;
        if (p.ok && p.reveal && p.reveal.video_id) { go(p.reveal, p.rev); return; }
        // p.ok sin señal nueva → sigue esperando (siempre disponible).
        if (!p.ok && p.reason === "not_found") { gone(); return; }
      });
    }
    // Baseline: espera una señal MÁS NUEVA que la que hay al entrar.
    rpc("mr_spec_state", { p_code: code }).then(function (s) {
      if (!s || (s.ok === false && s.reason === "not_found")) { gone(); return; }
      baseline = (s && typeof s.rev === "number") ? s.rev : 0;
      poll();
      // Sondeo rápido (400 ms): entrega casi instantánea y, a la vez, sirve de
      // latido de presencia (cada sondeo marca spectator_seen_at en el servidor,
      // así el mago sabe que hay alguien mirando y puede enviar).
      timer = setInterval(poll, 400);
    });
    // Mantiene la pantalla del espectador ENCENDIDA mientras espera, por dos vías:
    // 1) Wake Lock del navegador, reintentado en bucle y re-pedido si el sistema
    //    lo suelta (evento release).
    // 2) Vídeo mudo H.264 (#nsv): mientras un vídeo se reproduce, el sistema no
    //    apaga la pantalla. IMPORTANTE: sin atributo loop — se rebobina a mano en
    //    cada pasada (timeupdate), que es la técnica clásica fiable: con loop
    //    nativo, algunos sistemas dejan dormir la pantalla entre ciclos.
    // El modo de ahorro de energía del móvil puede denegar ambas vías; eso no es
    // evitable desde una página web. Por eso cada sondeo informa al servidor de
    // qué protección está activa (p_ka), y el mago la ve en su diagnóstico.
    var wl = null, nsv = document.getElementById("nsv"), vidStarted = false;
    function keepAwake() {
      if (done || document.hidden) return;
      try {
        if (navigator.wakeLock && navigator.wakeLock.request && !wl) {
          navigator.wakeLock.request("screen").then(function (w) {
            wl = w;
            try { w.addEventListener("release", function () { wl = null; }); } catch (e) {}
          }).catch(function () { wl = null; });
        }
      } catch (e) { wl = null; }
    }
    // Reproduce (o retoma) el vídeo mudo que impide el apagado de pantalla.
    function playNoSleep() {
      if (done || !nsv) return;
      try { nsv.muted = true; if (nsv.paused) { var p = nsv.play(); if (p && p.catch) p.catch(function () {}); } } catch (e) {}
    }
    if (nsv) {
      try { nsv.load(); } catch (e) {}
      // Rebobinado manual continuo: mantiene el estado "reproduciendo" sin cortes.
      nsv.addEventListener("timeupdate", function () {
        try {
          if (nsv.currentTime > 0.05) vidStarted = true;
          if (nsv.currentTime > 0.5) nsv.currentTime = Math.random() * 0.3;
        } catch (e) {}
      });
    }
    // Estado de la protección de pantalla, para el diagnóstico del mago.
    function kaState() {
      var v = false;
      try { v = !!(nsv && !nsv.paused && vidStarted); } catch (e) {}
      if (wl && v) return "wl+vid";
      if (wl) return "wl";
      if (v) return "vid";
      return "none";
    }
    keepAwake();
    playNoSleep();
    // Confirmación visual: cuando hay protección de pantalla activa (Wake Lock o
    // vídeo), el punto deja de parpadear y se queda FIJO. Así el mago VE que la
    // pantalla quedó fija encendida antes de entregar el móvil.
    function cue() {
      try {
        var el = document.getElementById("d");
        if (el) el.className = kaState() === "none" ? "d" : "d on";
      } catch (e) {}
    }
    // Bucle: mantiene el Wake Lock, asegura que el vídeo siga reproduciéndose
    // (iOS puede pausarlo al volver de 2º plano) y refresca la confirmación.
    wakeTimer = setInterval(function () { keepAwake(); playNoSleep(); cue(); }, 2000);
    // UN TOQUE EN LA PANTALLA (el del mago al abrir el enlace, antes de entregar
    // el móvil) fija la pantalla encendida de forma PERMANENTE: dentro de un
    // gesto, el sistema concede el Wake Lock y desbloquea el vídeo anti-apagado
    // incluso con el ahorro de energía activado. Después ya no hace falta tocar
    // nada más. El toque NO dispara la salida a YouTube (esa sigue siendo
    // automática, por el sondeo).
    function armKeepAwake() { keepAwake(); playNoSleep(); setTimeout(cue, 250); setTimeout(cue, 1200); }
    document.addEventListener("pointerdown", armKeepAwake, { passive: true });
    document.addEventListener("touchstart", armKeepAwake, { passive: true });
    document.addEventListener("click", armKeepAwake);
    document.addEventListener("keydown", armKeepAwake);
    // Recupera sondeo, Wake Lock y vídeo al volver a primer plano (bloqueo/desbloqueo, 2º plano)
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && !done) { poll(); keepAwake(); playNoSleep(); }
    });
  })();
